<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cek Nilai Mahasiswa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Cek Nilai Mahasiswa</h1>
    <p class="subtitle">Masukkan NIM dan nilai untuk mengetahui huruf mutu</p>

    <div class="form-group">
      <label for="nim">NIM (Nomor Induk Mahasiswa)</label>
      <input type="text" id="nim" placeholder="Contoh: 2410631170033" />
    </div>

    <div class="form-group">
      <label for="matkul">Mata Kuliah</label>
      <select id="matkul">
        <option value="">-- Pilih Mata Kuliah --</option>
        <option value="Pemrograman Web">Pemrograman Web</option>
        <option value="Analisis Desain Algoritma">Analisis Desain Algoritma</option>
        <option value="Statiska dan Probabilitas">Statiska dan Probabilitas</option>
        <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
        <option value="Kecerdasan Buatan">Kecerdasan Buatan</option>
        <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
        <option value="Sistem Operasi">Sistem Operasi</option>
      </select>
    </div>

    <div class="form-group">
      <label for="nilai">Nilai Mata Kuliah (0 – 100)</label>
      <input type="number" id="nilai" placeholder="Contoh: 85" min="0" max="100" />
    </div>

    <button onclick="cekNilai()">Cek Nilai</button>

    <div id="hasil"></div>

    <hr class="divider" />

    <table class="skala-table">
      <thead>
        <tr>
          <th>Rentang Nilai</th>
          <th>Huruf Mutu</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>80 – 100</td><td>A</td></tr>
        <tr><td>70 – 79</td><td>B</td></tr>
        <tr><td>60 – 69</td><td>C</td></tr>
        <tr><td>50 – 59</td><td>D</td></tr>
        <tr><td>0 – 49</td><td>E</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    function cekNilai() {
      var nim = document.getElementById('nim').value.trim();
      var matkul = document.getElementById('matkul').value;
      var nilaiInput = document.getElementById('nilai').value.trim();
      var hasilDiv = document.getElementById('hasil');


      if (nim === '' || matkul === '' || nilaiInput === '') {
        hasilDiv.style.display = 'block';
        hasilDiv.className = 'error';
        hasilDiv.innerHTML = '<strong>Perhatian!</strong> Semua field harus diisi.';
        return;
      }

      var nilai = parseFloat(nilaiInput);

      if (isNaN(nilai) || nilai < 0 || nilai > 100) {
        hasilDiv.style.display = 'block';
        hasilDiv.className = 'error';
        hasilDiv.innerHTML = '<strong>Nilai tidak valid!</strong><br>Masukkan nilai antara 0 hingga 100.';
        return;
      }

      var hurufMutu;
      if (nilai >= 80 && nilai <= 100) {
        hurufMutu = 'A';
      } else if (nilai >= 70 && nilai <= 79) {
        hurufMutu = 'B';
      } else if (nilai >= 60 && nilai <= 69) {
        hurufMutu = 'C';
      } else if (nilai >= 50 && nilai <= 59) {
        hurufMutu = 'D';
      } else {
        hurufMutu = 'E';
      }

      hasilDiv.style.display = 'block';
      hasilDiv.className = 'sukses';
      hasilDiv.innerHTML =
        '<span class="result-label">Hasil untuk NIM:</span><br>' +
        '<span class="result-nim">' + nim + '</span><br>' +
        '<span class="result-label" style="margin-top:6px; display:block;">Mata Kuliah: <strong>' + matkul + '</strong></span>' +
        '<div style="margin-top:10px;">' +
          '<span class="result-label">Nilai: <strong>' + nilai + '</strong> &nbsp;|&nbsp; Huruf Mutu:</span><br>' +
          '<div class="grade-badge">' + hurufMutu + '</div>' +
        '</div>';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') cekNilai();
    });
  </script>
</body>
</html>
